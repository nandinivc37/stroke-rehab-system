name: API and database foundation tests

on:
  push:
    branches:
      - feature/api-refactor
    paths:
      - "src/database/**"
      - "alembic/**"
      - "tests/api/**"
      - "requirements-api.txt"
      - ".github/workflows/api-database-tests.yml"
  pull_request:
    paths:
      - "src/database/**"
      - "alembic/**"
      - "tests/api/**"
      - "requirements-api.txt"
      - ".github/workflows/api-database-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-api.txt

      - name: Install API and database dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-api.txt pytest

      - name: Validate Python syntax
        run: |
          python -m compileall -q src/database alembic tests/api

      - name: Run API and database foundation tests
        run: |
          python -m pytest -q tests/api
