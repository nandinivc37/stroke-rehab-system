name: API and database foundation tests

on:
  push:
    branches:
      - feature/api-refactor
    paths:
      - "src/database/**"
      - "src/api/**"
      - "src/services/**"
      - "src/schemas/**"
      - "alembic/**"
      - "tests/**"
      - "requirements-api.txt"
      - "requirements.txt"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".dockerignore"
      - "README.md"
      - ".github/workflows/api-database-tests.yml"
  pull_request:
    paths:
      - "src/database/**"
      - "alembic/**"
      - "tests/**"
      - "requirements-api.txt"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".dockerignore"
      - "README.md"
      - ".github/workflows/api-database-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nars
          POSTGRES_PASSWORD: nars_test_password
          POSTGRES_DB: nars_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nars -d nars_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NARS_TEST_POSTGRES_URL: postgresql+psycopg://nars:nars_test_password@localhost:5432/nars_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-api.txt

      - name: Install API and database dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-api.txt pytest

      - name: Validate Python syntax
        run: python -m compileall -q src/api src/database alembic tests/api tests/database tests/test_api_client.py tests/test_pose_stream_client.py tests/test_remote_session.py

      - name: Run API and database foundation tests
        run: python -m pytest -q tests/api tests/database tests/test_api_client.py tests/test_pose_stream_client.py tests/test_remote_session.py

      - name: Validate Docker Compose configuration
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          NARS_JWT_SECRET: ci-jwt-secret-that-is-long-enough-for-tests
          NARS_BOOTSTRAP_ADMIN_USERNAME: ci-admin
          NARS_BOOTSTRAP_ADMIN_PASSWORD: ci-admin-password-long-enough
        run: docker compose config --quiet

      - name: Build API container image
        run: docker build --tag nars-api:ci .
